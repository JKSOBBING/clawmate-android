tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def manifest = new File(runtimeDir, 'src/main/assets/arkui-x/entry/module.json')
        def arkApp = new groovy.json.JsonSlurper().parse(manifest).app
